# XcodeGen 프로젝트 정의. 맥에서 `xcodegen` 을 실행하면 FindGlasses.xcodeproj 가 생긴다.
# .xcodeproj 는 손으로 쓰기 어렵고 충돌이 잦아 git 에 올리지 않고 이 파일을 원본으로 둔다.
name: FindGlasses
options:
  bundleIdPrefix: com.myaune
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.19.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  UserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0

targets:
  FindGlasses:
    type: application
    platform: iOS
    sources:
      - path: FindGlasses
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myaune.findglasses
        PRODUCT_NAME: FindGlasses
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Google Mobile Ads 가 요구한다
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        # 서명 팀은 Xcode 에서 고른다 (Signing & Capabilities)
        CODE_SIGN_STYLE: Automatic
    info:
      path: FindGlasses/Info.plist
      properties:
        CFBundleDisplayName: Find My Glasses
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko, ja, es, zh-Hans, zh-Hant, pt-BR, fr, de, it, ru, tr, ar, hi, id, vi, th]
        NSCameraUsageDescription: The camera is used to find your glasses. Video is processed only on this device and never leaves it.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        AdmobBannerId: $(ADMOB_BANNER_ID)
        AdmobInterstitialId: $(ADMOB_INTERSTITIAL_ID)
        # Google 의 SKAdNetwork ID. 전체 목록은 AdMob iOS 가이드에서 받아 추가한다 (README).
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    dependencies:
      - package: onnxruntime
        product: onnxruntime
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: UserMessagingPlatform
        product: GoogleUserMessagingPlatform
